# Configuración de Conexión a Base de Datos Relacional (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/db_inventario?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tu_contraseña

# Configuración del ORM Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto de ejecución del servidor web
server.port=8080